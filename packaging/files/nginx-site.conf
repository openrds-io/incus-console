# Incus Console behind nginx. Installed by incus-console-setup as
# /etc/nginx/conf.d/incus-console.conf; yours to edit afterwards (the server
# name, a real certificate).

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/incus-console/tls/server.crt;
    ssl_certificate_key /etc/incus-console/tls/server.key;

    # File browser uploads (MAX_CONTENT_LENGTH in config.py, 1 GiB by default).
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The terminal's websocket, and pages that update themselves.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
