{% extends "base.html" %}
{% set bare = true %}
{% block title %}Log in{% endblock %}
{% block heading %}<span class="login-brand"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="39" height="36"> Incus Console</span>{% endblock %}
{% block content %}
<div class="p-card login-card">
  <h2 class="p-heading--4">Log in</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="p-button--positive u-no-margin--bottom">Log in</button>
  </form>
</div>
{% endblock %}
