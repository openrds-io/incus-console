{% extends "base.html" %}
{% block title %}Problem{% endblock %}
{% block content %}
<h1>{% if error.status == 0 %}Cannot reach the server{% else %}Incus reported a problem{% endif %}</h1>
<p class="flash flash-error">{{ error.message }}</p>
<p><a class="btn" href="{{ path }}">Try again</a> <a class="btn btn-quiet" href="{{ url_for('servers.index') }}">Servers</a></p>
{% endblock %}
