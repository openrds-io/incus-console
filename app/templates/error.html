{% extends "base.html" %}
{% block title %}{% if error.status == 0 %}Cannot reach the server{% else %}Incus reported a problem{% endif %}{% endblock %}
{% block content %}
<div class="p-notification--negative">
  <div class="p-notification__content"><p class="p-notification__message">{{ error.message }}</p></div>
</div>
<a class="p-button" href="{{ path }}">Try again</a>
<a class="p-button--base" href="{{ url_for('servers.index') }}">Servers</a>
{% endblock %}
